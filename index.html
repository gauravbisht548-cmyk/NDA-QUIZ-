```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDA Quiz - Practice Test</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a12, #123d2b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .quiz {
      width: 100%;
      max-width: 650px;
      padding: 28px;
      background: #153528;
      border: 1px solid #426653;
      border-radius: 18px;
      box-shadow: 0 15px 40px #0005;
    }
    h1 { margin-top: 0; color: #a7f3c0; }
    .sub { color: #c2d5c9; }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 25px 0 12px;
    }
    .track {
      height: 8px;
      background: #304b3b;
      border-radius: 20px;
      overflow: hidden;
    }
    #bar {
      height: 100%;
      width: 0;
      background: #63e6a0;
      transition: width .2s;
    }
    h2 { font-size: 22px; line-height: 1.5; }
    #options { display: grid; gap: 12px; }
    .option {
      padding: 14px;
      border: 1px solid #597966;
      background: #203f30;
      color: white;
      border-radius: 10px;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }
    .option:hover:not(:disabled) { background: #2c5941; }
    .option:disabled { cursor: default; }
    .option.correct { background: #17653d; border-color: #61e89b; }
    .option.wrong { background: #792e35; border-color: #ff9292; }
    #feedback { min-height: 28px; margin: 16px 0; }
    .primary {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #a7f3c0;
      color: #102719;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    .primary:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <main class="quiz">
    <h1>NDA Quiz</h1>
    <p class="sub">Prepare • Practice • Improve</p>

    <div class="top">
      <span id="number">Question 1</span>
      <span id="score">Score: 0</span>
    </div>
    <div class="track"><div id="bar"></div></div>

    <h2 id="question">Loading question...</h2>
    <div id="options"></div>
    <p id="feedback" aria-live="polite"></p>
    <button class="primary" id="next" disabled>Next Question</button>
  </main>

  <script>
    const questions = [
      {
        q: "Which articles of the Indian Constitution deal with Fundamental Rights?",
        options: ["Articles 12 to 35", "Articles 36 to 51",
                  "Articles 52 to 78", "Articles 79 to 122"],
        answer: 0
      },
      {
        q: "What is the SI unit of force?",
        options: ["Joule", "Newton", "Watt", "Pascal"],
        answer: 1
      },
      {
        q: "Which planet is known as the Red Planet?",
        options: ["Venus", "Jupiter", "Mars", "Mercury"],
        answer: 2
      },
      {
        q: "Who is known as the Father of the Indian Constitution?",
        options: ["Mahatma Gandhi", "Jawaharlal Nehru",
                  "Dr. B. R. Ambedkar", "Sardar Patel"],
        answer: 2
      },
      {
        q: "What is the chemical symbol for gold?",
        options: ["Ag", "Fe", "Au", "Go"],
        answer: 2
      }
    ];

    let current = 0;
    let score = 0;
    let answered = false;

    const number = document.getElementById("number");
    const scoreText = document.getElementById("score");
    const question = document.getElementById("question");
    const options = document.getElementById("options");
    const feedback = document.getElementById("feedback");
    const next = document.getElementById("next");
    const bar = document.getElementById("bar");

    function showQuestion() {
      answered = false;
      const item = questions[current];
      number.textContent = `Question ${current + 1} of ${questions.length}`;
      scoreText.textContent = `Score: ${score}`;
      question.textContent = item.q;
      options.innerHTML = "";
      feedback.textContent = "";
      next.disabled = true;
      next.textContent = current === questions.length - 1
        ? "See Final Score" : "Next Question";
      bar.style.width = `${current / questions.length * 100}%`;

      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.className = "option";
        button.textContent = `${String.fromCharCode(65 + index)}. ${option}`;
        button.addEventListener("click", () => selectAnswer(index));
        options.appendChild(button);
      });
    }

    function selectAnswer(index) {
      if (answered) return;
      answered = true;
      const item = questions[current];
      const buttons = options.querySelectorAll("button");

      buttons.forEach((button, i) => {
        button.disabled = true;
        if (i === item.answer) button.classList.add("correct");
      });

      if (index === item.answer) {
        score++;
        feedback.textContent = "Correct answer! Well done.";
      } else {
        buttons[index].classList.add("wrong");
        feedback.textContent =
          `Incorrect. Correct answer: ${item.options[item.answer]}`;
      }

      scoreText.textContent = `Score: ${score}`;
      bar.style.width = `${(current + 1) / questions.length * 100}%`;
      next.disabled = false;
    }

    next.addEventListener("click", () => {
      if (!answered) return;

      current++;
      if (current < questions.length) {
        showQuestion();
      } else {
        number.textContent = "Quiz Completed";
        question.textContent = `Your final score: ${score}/${questions.length}`;
        options.innerHTML = "";
        feedback.textContent = "Keep practising to improve your score!";
        bar.style.width = "100%";
        next.textContent = "Restart Quiz";
        next.disabled = false;
        next.onclick = () => location.reload();
      }
    });

    showQuestion();
  </script>
</body>
</html>
